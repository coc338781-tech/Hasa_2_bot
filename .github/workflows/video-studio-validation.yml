name: Video Studio Validation

on:
  pull_request:
    branches:
      - fix/pairing-baileys-7rc14-test

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: npm install
      - run: npm run check
      - name: Live Gemini Video Studio API smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gemini-video-studio-smoke.js
