name: Oracle Full Auto Diagnostics

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Diagnostic scope"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - host-and-pm2
          - external-services
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: hasa2-oracle-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Read-only Oracle and provider diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure restricted SSH
        if: ${{ github.event_name == 'schedule' || inputs.scope != 'external-services' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing ORACLE_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "::error::Missing ORACLE_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing ORACLE_SSH_USER"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          printf 'SSH_HOST=%s\nSSH_USER=%s\n' "$SSH_HOST" "$SSH_USER" >> "$GITHUB_ENV"

      - name: Run read-only host, PM2 and crash diagnostics
        if: ${{ github.event_name == 'schedule' || inputs.scope == 'full' || inputs.scope == 'host-and-pm2' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/oracle-diagnostics.sh | tee oracle-diagnostics.txt

      - name: Run real external-provider smoke tests on Oracle
        if: ${{ github.event_name == 'schedule' || inputs.scope == 'full' || inputs.scope == 'external-services' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          if [ ! -f ~/.ssh/oracle_key ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
            chmod 600 ~/.ssh/oracle_key
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            chmod 600 ~/.ssh/known_hosts
          fi
          cat > provider-smoke.sh <<'REMOTE'
          set -u
          cd /home/opc/Hasa_2_bot
          echo "===== PROVIDER SMOKE TESTS (Oracle host) ====="
          node --input-type=module <<'NODE'
          import 'dotenv/config';
          const checks = [];
          const importance = {
            'Dictionary API':'LOW — dictionary command only; bot core is unaffected.',
            'MyMemory Translation API':'MEDIUM — translation command may fail while provider is unavailable.',
            'Gemini generateContent':'HIGH — AI chat and AI Studio replies depend on Gemini.',
            'yt-dlp':'HIGH — video/audio download commands depend on this executable.',
            'FFmpeg':'MEDIUM — media conversion, trimming and audio processing depend on FFmpeg.',
            'YouTube search metadata':'MEDIUM — YouTube search/discovery may fail; direct supported links may still work.'
          };
          const add = (name, ok, detail) => checks.push({name,ok,detail,importance:importance[name]||'LOW'});
          async function request(name, url) {
            try { const r = await fetch(url, {signal:AbortSignal.timeout(15000)}); await r.arrayBuffer(); add(name,r.ok,'HTTP '+r.status); }
            catch(e) { add(name,false,(e.name||'Error')+': '+String(e.message||e).slice(0,120)); }
          }
          await request('Dictionary API','https://api.dictionaryapi.dev/api/v2/entries/en/hello');
          await request('MyMemory Translation API','https://api.mymemory.translated.net/get?q=hello&langpair=en%7Csi');
          const key=process.env.GEMINI_API_KEY;
          const fs=await import('node:fs');
          const botConfig=JSON.parse(fs.readFileSync('config.json','utf8'));
          const model=botConfig.aiModel||'gemini-2.0-flash';
          if (!key) add('Gemini generateContent',false,'GEMINI_API_KEY not available in Oracle environment');
          else {
            try {
              const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply with exactly OK'}]}]}),signal:AbortSignal.timeout(45000)});
              const data=await r.json();
              const ok=r.ok&&Boolean(data?.candidates?.[0]?.content?.parts?.[0]?.text);
              add('Gemini generateContent',ok,ok?'HTTP '+r.status:'HTTP '+r.status+' '+String(data?.error?.status||data?.error?.message||'No generated text').slice(0,100));
            } catch(e) { add('Gemini generateContent',false,(e.name||'Error')+': '+String(e.message||e).slice(0,120)); }
          }
          const {execFile}=await import('node:child_process');
          const {promisify}=await import('node:util');
          const exec=promisify(execFile);
          for (const [name,bin,args] of [['yt-dlp','yt-dlp',['--version']],['FFmpeg','ffmpeg',['-version']]]) {
            try { const {stdout,stderr}=await exec(bin,args,{timeout:10000,maxBuffer:1024*1024}); add(name,true,(stdout||stderr).split('\n')[0].slice(0,100)); }
            catch(e) { add(name,false,String(e.code||e.message||'unavailable').slice(0,120)); }
          }
          let ytOk=false, ytDetail='No metadata returned';
          for (const [label,url] of [['YouTube public video','https://www.youtube.com/watch?v=jfKfPfyJRdk'],['YouTube search','ytsearch1:lofi music']]) {
            try {
              const {stdout}=await exec('yt-dlp',['--dump-single-json','--skip-download','--no-warnings','--no-playlist',url],{timeout:45000,maxBuffer:2*1024*1024});
              const meta=JSON.parse(stdout), entry=meta?.entries?.[0]||meta;
              if(entry?.id){ytOk=true;ytDetail=label+' metadata received';break;}
              ytDetail=label+': JSON had no video ID';
            } catch(e) {
              const msg=String(e.stderr||e.message||e.code||'failed').split(/\r?\n/).filter(Boolean).slice(-1)[0]||'failed';
              ytDetail=label+': '+msg.replace(/https?:\/\/\S+/g,'[URL]').replace(/\b\d{8,}\b/g,'[ID]').slice(0,120);
            }
          }
          add('YouTube search metadata',ytOk,ytDetail);
          for(const c of checks) console.log((c.ok?'PASS':'WARN')+' | '+c.name+' | '+c.detail+' | Importance: '+c.importance);
          console.log('RESULT '+checks.filter(x=>x.ok).length+'/'+checks.length+' passed; '+checks.filter(x=>!x.ok).length+' warning(s).');
          // Third-party provider outages are warnings, not Oracle/WhatsApp infrastructure failures.
          NODE
          REMOTE
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' < provider-smoke.sh | tee provider-smoke.txt

      - name: Publish concise run summary
        if: always()
        run: |
          {
            echo "## Oracle Full Auto Diagnostics"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Scope: ${{ inputs.scope || 'scheduled full' }}"
            echo "- Full output is in the job logs and attached artifact."
            echo "- Read-only: no PM2 restart and no WhatsApp auth/session file access."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-diagnostics-${{ github.run_id }}
          path: |
            oracle-diagnostics.txt
            provider-smoke.txt
          if-no-files-found: ignore
          retention-days: 7
