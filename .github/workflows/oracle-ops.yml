name: Oracle Full Auto Diagnostics

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Diagnostic scope"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - host-and-pm2
          - external-services

permissions:
  contents: read

concurrency:
  group: hasa2-oracle-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Read-only Oracle and provider diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure restricted SSH
        if: ${{ inputs.scope != 'external-services' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing ORACLE_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "::error::Missing ORACLE_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing ORACLE_SSH_USER"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          printf 'SSH_HOST=%s\nSSH_USER=%s\n' "$SSH_HOST" "$SSH_USER" >> "$GITHUB_ENV"

      - name: Run read-only host, PM2 and crash diagnostics
        if: ${{ inputs.scope == 'full' || inputs.scope == 'host-and-pm2' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/oracle-diagnostics.sh | tee oracle-diagnostics.txt

      - name: Run real external-provider smoke tests on Oracle
        if: ${{ inputs.scope == 'full' || inputs.scope == 'external-services' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          if [ ! -f ~/.ssh/oracle_key ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
            chmod 600 ~/.ssh/oracle_key
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            chmod 600 ~/.ssh/known_hosts
          fi
          cat > provider-smoke.sh <<'REMOTE'
          set -u
          cd /home/opc/Hasa_2_bot
          echo "===== PROVIDER SMOKE TESTS (Oracle host) ====="
          node --input-type=module <<'NODE'
          import 'dotenv/config';
          const checks = [];
          const add = (name, state, detail) => checks.push({name,state,detail});
          const errorText = e => (e?.name || 'Error') + ': ' + String(e?.message || e).replace(/[\\r\\n]+/g,' ').slice(0,140);

          try {
            const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/hello', {signal:AbortSignal.timeout(12000)});
            const data = await r.json().catch(() => null);
            const ok = r.ok && Array.isArray(data) && Boolean(data[0]?.meanings?.length);
            add('Dictionary API',ok?'PASS':'FAIL',ok?'sample definition returned':'HTTP '+r.status+'; valid definition missing');
          } catch(e) { add('Dictionary API','FAIL',errorText(e)); }

          try {
            const url = new URL('https://api.mymemory.translated.net/get');
            url.searchParams.set('q','Hello world');
            url.searchParams.set('langpair','en|si');
            const r = await fetch(url,{signal:AbortSignal.timeout(15000)});
            const data = await r.json().catch(() => ({}));
            const ok = r.ok && Number(data.responseStatus) < 400 && Boolean(data.responseData?.translatedText);
            add('Translation API',ok?'PASS':'FAIL',ok?'English-to-Sinhala sample returned':'HTTP '+r.status+'; translation missing');
          } catch(e) { add('Translation API','FAIL',errorText(e)); }

          const key = process.env.GEMINI_API_KEY;
          let model = 'gemini-2.0-flash';
          try {
            const fs = await import('node:fs');
            const botConfig = JSON.parse(fs.readFileSync('config.json','utf8'));
            model = botConfig.aiModel || model;
          } catch(e) { add('Bot config','FAIL','config.json unavailable or invalid'); }
          if (!key) add('Gemini API','SKIP','GEMINI_API_KEY is not configured; no API request made');
          else {
            try {
              const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key), {
                method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({contents:[{parts:[{text:'Reply with exactly OK'}]}]}),
                signal:AbortSignal.timeout(20000)
              });
              const data = await r.json().catch(() => ({}));
              const ok = r.ok && Boolean(data?.candidates?.[0]?.content?.parts?.[0]?.text);
              add('Gemini API',ok?'PASS':'FAIL',ok?'configured model '+model+' generated a response':'HTTP '+r.status+'; generation failed');
            } catch(e) { add('Gemini API','FAIL',errorText(e)); }
          }
          const {execFile} = await import('node:child_process');
          const {promisify} = await import('node:util');
          const exec = promisify(execFile);
          for (const [name,bin,args] of [['yt-dlp','yt-dlp',['--version']],['FFmpeg','ffmpeg',['-version']]]) {
            try { const {stdout,stderr}=await exec(bin,args,{timeout:10000,maxBuffer:1024*1024}); add(name,true,(stdout||stderr).split('\n')[0].slice(0,100)); }
            catch(e) { add(name,false,String(e.code||e.message||'unavailable').slice(0,140)); }
          }
          for (const c of checks) console.log(c.state+' | '+c.name+' | '+c.detail);
          const passed = checks.filter(x=>x.state==='PASS').length;
          const skipped = checks.filter(x=>x.state==='SKIP').length;
          const failed = checks.filter(x=>x.state==='FAIL').length;
          console.log('RESULT '+passed+' passed, '+skipped+' skipped, '+failed+' failed');
          if (failed) process.exitCode=2;
          NODE
          REMOTE
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' < provider-smoke.sh | tee provider-smoke.txt

      - name: Publish concise run summary
        if: always()
        run: |
          {
            echo "## Oracle Full Auto Diagnostics"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Scope: ${{ inputs.scope || 'manual' }}"
            echo "- Full output is in the job logs and attached artifact."
            echo "- Read-only: no PM2 restart and no WhatsApp auth/session file access."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-diagnostics-${{ github.run_id }}
          path: |
            oracle-diagnostics.txt
            provider-smoke.txt
          if-no-files-found: ignore
          retention-days: 7
