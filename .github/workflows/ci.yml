name: Hasa 2 Bot - Safe CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hasa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax and plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check syntax and plugin loading
        run: npm run check

      - name: Test Baileys decrypt retry
        run: npm run test:decrypt-retry

      - name: Test system information
        run: npm run test:system-info
