name: OCI Read-only Access Audit

on:
  push:
    branches:
      - assistant-workflow
    paths:
      - '.github/oracle-control/oci-request.json'

permissions:
  contents: read

concurrency:
  group: hasa2-oci-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate request
        run: |
          set -euo pipefail
          ACTION="$(jq -r '.action // empty' .github/oracle-control/oci-request.json)"
          REQUEST_ID="$(jq -r '.request_id // empty' .github/oracle-control/oci-request.json)"
          test "$ACTION" = "identity-audit"
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]
          echo "REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"

      - name: Install OCI CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/oci" --version

      - name: Configure OCI API key securely
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          for name in OCI_PRIVATE_KEY OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.oci"
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"
          unset OCI_PRIVATE_KEY OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_REGION
          echo "OCI CLI configuration created; secret values were not printed."

      - name: Run read-only identity and compute access checks
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          set -euo pipefail
          test -n "$OCI_COMPARTMENT_OCID"
          echo "===== OCI REGION AUTHENTICATION ====="
          oci iam region list --output table
          echo "===== AVAILABILITY DOMAINS ====="
          oci iam availability-domain list --compartment-id "$OCI_COMPARTMENT_OCID" --output table
          echo "===== COMPUTE INSTANCES (READ ONLY) ====="
          oci compute instance list --compartment-id "$OCI_COMPARTMENT_OCID" --all --query 'data[].{Name:"display-name",Shape:shape,State:"lifecycle-state"}' --output table
          echo "===== AUDIT COMPLETE ====="
          echo "No cloud resources were created, changed, or deleted."
