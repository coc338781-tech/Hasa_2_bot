name: OCI Read-only Access Audit

on:
  push:
    branches:
      - assistant-workflow
    paths:
      - '.github/workflows/oci-access-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hasa2-oci-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OCI CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/oci" --version

      - name: Configure OCI API key securely
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          for name in OCI_PRIVATE_KEY OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.oci"
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"
          unset OCI_PRIVATE_KEY OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_REGION
          echo "OCI CLI configured. Secret values were not printed."

      - name: Audit A1 quota and capacity (no VM changes)
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          set -euo pipefail
          test -n "$OCI_COMPARTMENT_OCID"
          AD="dxtt:AP-MUMBAI-1-AD-1"

          echo "===== A1 OCPU QUOTA / USAGE ====="
          oci limits resource-availability get \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --service-name compute \
            --limit-name standard-a1-core-count \
            --availability-domain "$AD" \
            --output json

          echo "===== A1 MEMORY QUOTA / USAGE ====="
          oci limits resource-availability get \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --service-name compute \
            --limit-name standard-a1-memory-count \
            --availability-domain "$AD" \
            --output json

          echo "===== REQUESTING A1 2 OCPU / 12 GB CAPACITY REPORT ====="
          echo "This requests a capacity report only; it does NOT launch, stop, resize, or delete any VM."
          oci compute compute-capacity-report create \
            --availability-domain "$AD" \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --shape-availabilities '[{"instanceShape":"VM.Standard.A1.Flex","instanceShapeConfig":{"ocpus":2,"memoryInGBs":12}}]' \
            --output json

          echo "===== CURRENT VM INVENTORY (UNCHANGED) ====="
          oci compute instance list --compartment-id "$OCI_COMPARTMENT_OCID" --all \
            --query 'data[].{Name:"display-name",Shape:shape,State:"lifecycle-state"}' --output table

          echo "===== A1 QUOTA AND CAPACITY AUDIT COMPLETE ====="
          echo "No compute instances were created, changed, stopped, or deleted."
