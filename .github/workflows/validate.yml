name: Validate Hasa 2 Bot

on:
  push:
    branches:
      - assistant-workflow
  pull_request:
    branches:
      - assistant-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and plugin checks
        run: npm run check
      - name: Run tests
        run: |
          npm run test:decrypt-retry --if-present
          npm run test:system-info --if-present
