name: Validate Hasa 2 Bot

on:
  push:
    branches:
      - assistant-workflow
  pull_request:
    branches:
      - assistant-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and plugin checks
        run: npm run check
      - name: Run tests
        run: |
          npm run test:decrypt-retry --if-present
          npm run test:system-info --if-present
