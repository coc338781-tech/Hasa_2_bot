name: Oracle Remote Control

on:
  push:
    branches:
      - assistant-workflow
    paths:
      - '.github/oracle-control/request.json'

permissions:
  contents: read

concurrency:
  group: hasa2-oracle-control
  cancel-in-progress: false

jobs:
  status:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read approved request
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          ACTION="$(jq -r '.action // empty' .github/oracle-control/request.json)"
          REQUEST_ID="$(jq -r '.request_id // empty' .github/oracle-control/request.json)"
          test "$ACTION" = "status"
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Read Oracle PM2 status
        id: oracle
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          RESULT="$(ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'set -e; echo "Commit:"; git -C /home/opc/Hasa_2_bot rev-parse --short HEAD; echo "PM2:"; pm2 describe hasa2 | sed -n "1,24p"; echo "PM2 list:"; pm2 status hasa2' 2>&1)"
          {
            echo 'result<<ORACLE_RESULT'
            printf '%s\n' "$RESULT"
            echo 'ORACLE_RESULT'
          } >> "$GITHUB_OUTPUT"

      - name: Send result to private report repository
        env:
          REPORT_TOKEN: ${{ secrets.BOT_TEST_REPORT_TOKEN }}
          REPORT_REPO: ${{ secrets.BOT_TEST_REPORT_REPO }}
          RESULT: ${{ steps.oracle.outputs.result }}
          REQUEST_ID: ${{ env.request_id }}
        run: |
          set -euo pipefail
          test -n "$REPORT_TOKEN"
          test -n "$REPORT_REPO"
          TITLE="Oracle status [$REQUEST_ID]"
          BODY="Read-only Oracle PM2 status report.\n\n$RESULT"
          JSON="$(jq -n --arg title "$TITLE" --arg body "$BODY" '{title:$title,body:$body}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error -X POST "https://api.github.com/repos/$REPORT_REPO/issues" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $REPORT_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$JSON")"
          URL="$(printf '%s' "$RESPONSE" | jq -r '.html_url // empty')"
          test -n "$URL"
          echo "Private status report created."
