name: Oracle Remote Control

on:
  push:
    branches:
      - assistant-workflow
    paths:
      - '.github/oracle-control/request.json'

permissions:
  contents: read

concurrency:
  group: hasa2-oracle-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read and validate approved request
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          ACTION="$(jq -r '.action // empty' .github/oracle-control/request.json)"
          REQUEST_ID="$(jq -r '.request_id // empty' .github/oracle-control/request.json)"
          case "$ACTION" in status|logs|restart|rollback|remove-old|inspect-changes|inspect-guard-script|patch-deploy-guard) ;; *) echo "Rejected operation"; exit 1 ;; esac
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Execute fixed Oracle operation
        id: oracle
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE_SCRIPT="$(cat <<'SCRIPT'
          set -Eeuo pipefail
          APP=/home/opc/Hasa_2_bot
          BACKUPS=/home/opc/hasa-backups
          cd "$APP"

          print_status() {
            pm2 jlist | node -e '
              let s = "";
              process.stdin.on("data", d => s += d);
              process.stdin.on("end", () => {
                const p = JSON.parse(s).find(x => x.name === "hasa2");
                if (!p) { console.log("PM2 process hasa2: NOT FOUND"); process.exitCode = 1; return; }
                const e = p.pm2_env || {};
                const m = p.monit || {};
                console.log("PM2 status: " + (e.status || "unknown"));
                console.log("Restart count: " + (e.restart_time ?? "unknown"));
                console.log("Uptime: " + (e.pm_uptime ? Math.floor((Date.now()-e.pm_uptime)/1000) + " seconds" : "unknown"));
                console.log("Memory: " + (m.memory != null ? Math.round(m.memory/1048576) + " MB" : "unknown"));
                console.log("CPU: " + (m.cpu != null ? m.cpu + "%" : "unknown"));
              });
            '
          }

          echo "Request: $REQUEST_ID"
          echo "Operation: $ACTION"
          echo "Current commit: $(git rev-parse --short HEAD)"
          case "$ACTION" in
            status)
              print_status
              ;;
            logs)
              echo "Filtered diagnostics only; chat/message-like lines are excluded."
              FOUND=0
              for f in "$HOME/.pm2/logs/hasa2-error.log" "$HOME/.pm2/logs/hasa2-out.log"; do
                if [ -f "$f" ]; then
                  MATCHES="$(tail -n 200 "$f" | grep -Ei 'error|warn|exception|failed|timeout|401|403|408|429|disconnect|reconnect|uncaught|rejection' | grep -Eiv 'message|chat|jid|from|to|body|text|payload|quoted|contact|media|@s\.whatsapp\.net|@g\.us' | sed -E 's/[0-9]{8,}/[REDACTED_NUMBER]/g; s#https?://[^ ]+#URL_REDACTED#g' | tail -n 30 || true)"
                  if [ -n "$MATCHES" ]; then
                    echo "--- $(basename "$f") ---"
                    printf '%s\n' "$MATCHES"
                    FOUND=1
                  fi
                fi
              done
              [ "$FOUND" -eq 1 ] || echo "No matching diagnostic lines found."
              print_status
              ;;
            inspect-changes)
              echo "Tracked and untracked file names only; file contents are not shown."
              echo "--- git status --short ---"
              git status --short
              echo "--- tracked diff summary ---"
              git diff --stat
              echo "--- staged diff summary ---"
              git diff --cached --stat
              echo "--- untracked non-ignored files ---"
              git ls-files --others --exclude-standard
              print_status
              ;;
            inspect-guard-script)
              echo "Read-only inspection of deploy guard script."
              sed -n "1,240p" /home/opc/bin/hasa2-deploy
              ;;
            patch-deploy-guard)
              GUARD=/home/opc/bin/hasa2-deploy
              BACKUP="${GUARD}.bak-$(date +%Y%m%d-%H%M%S)"
              cp -p "$GUARD" "$BACKUP"
              python3 - "$GUARD" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = '  if [ -n "$(git status --porcelain)" ]; then'
          if old not in s:
              raise SystemExit("Expected deploy guard line not found; no changes made.")
          s = s.replace(old, '  if [ -n "$(git status --porcelain --untracked-files=no)" ]; then', 1)
          needle = '  OLD_SHA="$(git rev-parse HEAD)"'
          block = """  UNTRACKED=\"$(git ls-files --others --exclude-standard)\"
            UNEXPECTED=\"$(printf '%s\\n' \"$UNTRACKED\" | grep -Ev '^(bot_logo[.]jpg|package-lock[.]json)$' || true)\"
            if [ -n \"$UNEXPECTED\" ]; then
              echo \"STOP: Unexpected untracked files exist; preserving them.\"
              printf '%s\\n' \"$UNEXPECTED\"
              exit 1
            fi

          """
          if needle not in s:
              raise SystemExit("Deploy guard insertion point not found; no changes made.")
          p.write_text(s.replace(needle, block + needle, 1))
          PY
              bash -n "$GUARD"
              echo "Deploy guard updated; original backup: $BACKUP"
              sed -n "14,52p" "$GUARD"
              ;;
            restart)
              pm2 restart hasa2 --update-env
              sleep 6
              print_status
              ;;
            remove-old)
              # Only remove the known legacy PM2 app; refuse if its script path differs.
              OLD_SCRIPT="$(pm2 jlist | node -e '
                let s = "";
                process.stdin.on("data", d => s += d);
                process.stdin.on("end", () => {
                  const p = JSON.parse(s).find(x => x.name === "hasamd");
                  console.log(p && p.pm2_env ? (p.pm2_env.pm_exec_path || "") : "NOT_FOUND");
                });
              ')"
              if [ "$OLD_SCRIPT" != "NOT_FOUND" ] && [ "$OLD_SCRIPT" != "/home/opc/HASA-MD_next-Bot/index.js" ]; then
                echo "Refusing removal: legacy PM2 script path did not match the expected old bot."
                exit 1
              fi
              mkdir -p "$BACKUPS"
              if [ -d /home/opc/HASA-MD_next-Bot ]; then
                ARCHIVE="$BACKUPS/legacy-HASA-MD_next-Bot-$(date +%Y%m%d-%H%M%S).tar.gz"
                tar -czf "$ARCHIVE" -C /home/opc HASA-MD_next-Bot
                echo "Legacy bot archive created: $ARCHIVE"
              fi
              if [ "$OLD_SCRIPT" != "NOT_FOUND" ]; then
                pm2 stop hasamd
                pm2 delete hasamd
              fi
              if [ -d /home/opc/HASA-MD_next-Bot ]; then
                rm -rf -- /home/opc/HASA-MD_next-Bot
              fi
              pm2 save
              echo "Legacy hasamd process removed."
              if pm2 jlist | node -e '
                let s = "";
                process.stdin.on("data", d => s += d);
                process.stdin.on("end", () => {
                  const p = JSON.parse(s).find(x => x.name === "hasa2");
                  if (!p || !p.pm2_env || p.pm2_env.status !== "online") process.exitCode = 1;
                });
              '; then
                echo "New hasa2 process remains online."
              else
                echo "ERROR: new hasa2 process is not online."
                exit 1
              fi
              pm2 status
              ;;
            rollback)
              test -s "$BACKUPS/last-good-commit"
              TARGET="$(cat "$BACKUPS/last-good-commit")"
              CURRENT="$(git rev-parse HEAD)"
              git cat-file -e "$TARGET^{commit}"
              printf '%s\n' "$CURRENT" > "$BACKUPS/last-good-commit"
              git reset --hard "$TARGET"
              npm install --no-audit --no-fund
              npm run check
              pm2 restart hasa2 --update-env
              sleep 8
              print_status
              echo "Rolled back to: $(git rev-parse --short HEAD)"
              ;;
          esac
          SCRIPT
          )"
          RESULT="$(printf '%s\n' "$REMOTE_SCRIPT" | ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "ACTION='$ACTION' REQUEST_ID='$REQUEST_ID' bash -s" 2>&1)"
          {
            echo 'result<<ORACLE_RESULT'
            printf '%s\n' "$RESULT"
            echo 'ORACLE_RESULT'
          } >> "$GITHUB_OUTPUT"

      - name: Send result to private report repository
        env:
          REPORT_TOKEN: ${{ secrets.BOT_TEST_REPORT_TOKEN }}
          REPORT_REPO: ${{ secrets.BOT_TEST_REPORT_REPO }}
          RESULT: ${{ steps.oracle.outputs.result }}
        run: |
          set -euo pipefail
          test -n "$REPORT_TOKEN"
          test -n "$REPORT_REPO"
          TITLE="Oracle $ACTION report [$REQUEST_ID]"
          BODY="$(printf 'Operation: %s\nRequest: %s\n\n%s' "$ACTION" "$REQUEST_ID" "$RESULT")"
          JSON="$(jq -n --arg title "$TITLE" --arg body "$BODY" '{title:$title,body:$body}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error -X POST "https://api.github.com/repos/$REPORT_REPO/issues" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $REPORT_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$JSON")"
          URL="$(printf '%s' "$RESPONSE" | jq -r '.html_url // empty')"
          test -n "$URL"
          echo "Private Oracle report created."
