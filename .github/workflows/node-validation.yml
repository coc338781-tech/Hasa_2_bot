name: Node.js validation

on:
  pull_request:
    branches: [assistant-workflow]
  push:
    branches: [assistant-workflow, feature/view-once-reply-save]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Run project checks and tests
        run: npm run check
