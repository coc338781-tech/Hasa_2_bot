name: Bot checks

on:
  pull_request:
    branches:
      - fix/pairing-baileys-7rc14-test
  push:
    branches:
      - fix/subbot-auto-restore

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run project checks
        run: npm run check
