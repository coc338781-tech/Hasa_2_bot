name: Deploy Hasa_2_bot to Oracle

on:
  push:
    branches:
      - assistant-workflow
    paths-ignore:
      - '.github/oracle-control/**'
      - '.github/workflows/oracle-control.yml'
  workflow_dispatch:

concurrency:
  group: hasa2-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Backup, update and verify on Oracle
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          BOT_TEST_REPORT_TOKEN: ${{ secrets.BOT_TEST_REPORT_TOKEN }}
          BOT_TEST_REPORT_REPO: ${{ secrets.BOT_TEST_REPORT_REPO }}
        run: |
          set -euo pipefail
          REPORT_ENV_B64="$(printf 'BOT_TEST_REPORT_TOKEN=%s\nBOT_TEST_REPORT_REPO=%s\n' "$BOT_TEST_REPORT_TOKEN" "$BOT_TEST_REPORT_REPO" | base64 -w0)"
          ssh -i ~/.ssh/oracle_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" "REPORT_ENV_B64='$REPORT_ENV_B64' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/home/opc/Hasa_2_bot
          BRANCH=assistant-workflow
          BACKUPS=/home/opc/hasa-backups
          mkdir -p "$BACKUPS"
          chmod 700 "$BACKUPS"
          cd "$APP"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Deploy stopped: tracked local changes exist."
            exit 1
          fi

          PREVIOUS=$(git rev-parse HEAD)
          BACKUP="$BACKUPS/predeploy-$(date +%Y%m%d-%H%M%S).tar.gz"
          tar -czf "$BACKUP" --exclude='./node_modules' --exclude='./auth_info' --exclude='./.git' --exclude='./downloads' .
          chmod 600 "$BACKUP"
          printf '%s\n' "$PREVIOUS" > "$BACKUPS/last-good-commit"

          rollback() {
            echo "Deployment failed; restoring previous code $PREVIOUS"
            git reset --hard "$PREVIOUS" || true
            npm install --no-audit --no-fund || true
            pm2 restart hasa2 --update-env || true
          }
          trap rollback ERR

          if [ -n "${REPORT_ENV_B64:-}" ]; then
            printf '%s' "$REPORT_ENV_B64" | base64 -d > "$APP/.botcheck.env.tmp"
            if [ -f "$APP/.env" ]; then
              grep -v -E '^BOT_TEST_REPORT_(TOKEN|REPO)=' "$APP/.env" > "$APP/.env.tmp" || true
              cat "$APP/.botcheck.env.tmp" >> "$APP/.env.tmp"
              mv "$APP/.env.tmp" "$APP/.env"
            else
              mv "$APP/.botcheck.env.tmp" "$APP/.env"
            fi
            chmod 600 "$APP/.env"
            rm -f "$APP/.botcheck.env.tmp"
          fi

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          npm install --no-audit --no-fund
          npm run check
          pm2 restart hasa2 --update-env
          sleep 8
          if ! pm2 describe hasa2 | grep -q 'online'; then
            echo "PM2 process is not online after restart."
            exit 1
          fi
          trap - ERR
          echo "Deployment successful: $(git rev-parse --short HEAD)"
          pm2 status hasa2
          echo "Backup: $BACKUP"
          REMOTE
